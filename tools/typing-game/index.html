<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タイピングゲーム</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="tb-header tg-header">
      <div class="tb-header-start">
        <template id="toolbox-home"></template>
        <span class="tb-header-brand"
          ><img
            class="tb-header-icon"
            src="/src/icon.png"
            alt=""
          />タイピングゲーム</span
        ><button
          type="button"
          class="tb-button tb-icon-button tb-theme-toggle"
        ></button>
      </div>
    </header>

    <main class="tg-main" id="tg-main" data-state="setup">
      <section
        class="tg-pane"
        id="tg-sample-pane"
        aria-labelledby="tg-sample-title"
      >
        <div class="tg-pane-head">
          <h2 id="tg-sample-title">見本</h2>
          <span class="tg-count" id="tg-count"></span>
          <span class="tg-progress" id="tg-progress" aria-hidden="true"></span>
        </div>
        <div class="tg-pane-body">
          <textarea
            id="tg-source"
            class="tb-input tg-text"
            aria-labelledby="tg-sample-title"
            placeholder="練習したい文章を、ここに貼り付けます。&#10;&#10;漢字まじりの文章のままで構いません。いつもの日本語入力で、変換して確定しながら打ちます。"
            spellcheck="false"
            autocomplete="off"
          ></textarea>
          <div class="tg-text tg-sample" id="tg-sample" hidden></div>
        </div>
      </section>

      <section
        class="tg-pane"
        id="tg-input-pane"
        aria-labelledby="tg-input-title"
      >
        <div class="tg-pane-head">
          <h2 id="tg-input-title">入力</h2>
          <p class="tg-esc-hint" id="tg-esc-hint" hidden>
            確定後に <kbd>Esc</kbd> で終了
          </p>
          <span class="tg-elapsed" id="tg-elapsed" hidden></span>
        </div>
        <div class="tg-pane-body">
          <div class="tg-ready" id="tg-ready">
            <button
              type="button"
              class="tb-button tb-primary tg-start"
              id="tg-start"
              disabled
            >
              開始
            </button>
            <p class="tg-shortcut">
              <kbd id="tg-modifier">Ctrl</kbd> + <kbd>Enter</kbd> でも開始
            </p>
            <p class="tg-note" id="tg-note" role="status"></p>
            <ol class="tg-steps">
              <li>左の欄に文章を貼り付けます</li>
              <li>「開始」を押すと、3秒後にスタートします</li>
              <li>いつもの日本語入力で打ち、確定後に Esc で終了します</li>
            </ol>
          </div>
          <textarea
            id="tg-typed"
            class="tb-input tg-text"
            aria-labelledby="tg-input-title"
            aria-describedby="tg-esc-hint"
            placeholder="ここに打ちます"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            hidden
            disabled
          ></textarea>
          <div class="tg-countdown" id="tg-countdown" hidden>
            <svg class="tg-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="tg-ring-track" cx="60" cy="60" r="56" />
              <circle
                class="tg-ring-bar"
                id="tg-ring-bar"
                cx="60"
                cy="60"
                r="56"
                pathLength="1"
              />
            </svg>
            <span
              class="tg-count-number"
              id="tg-count-number"
              role="status"
            ></span>
            <span class="tg-countdown-hint"><kbd>Esc</kbd> でやめる</span>
          </div>
          <p class="tg-judging" id="tg-judging" hidden>判定しています…</p>
          <div class="tg-result" id="tg-result" hidden>
            <div class="tg-summary">
              <div class="tg-stat">
                <span class="tg-stat-label">かかった時間</span>
                <span
                  class="tg-stat-value"
                  id="tg-time"
                  aria-hidden="true"
                ></span>
              </div>
              <div class="tg-stat" id="tg-diffs-stat">
                <span class="tg-stat-label">見本との違い</span>
                <span
                  class="tg-stat-value"
                  id="tg-diffs"
                  aria-hidden="true"
                ></span>
              </div>
              <div class="tg-actions">
                <button
                  type="button"
                  class="tb-button tb-primary"
                  id="tg-retry"
                >
                  もう一度
                </button>
                <button
                  type="button"
                  class="tb-button tb-secondary"
                  id="tg-new"
                >
                  別の文章を貼る
                </button>
              </div>
            </div>
            <p class="tg-legend" id="tg-legend">
              <span><del class="tg-wrong">転</del> 打ち間違い・余分な文字</span>
              <span
                ><ins class="tg-missing">天</ins> 抜けた文字（見本の文字）</span
              >
            </p>
            <p class="tg-result-note" id="tg-result-note" hidden>
              見本と大きく違うため、違う箇所を示せませんでした。打った文章をそのまま表示しています。
            </p>
            <div class="tg-text tg-diff" id="tg-diff"></div>
          </div>
        </div>
      </section>
    </main>

    <p class="tg-sr" id="tg-announce" role="status"></p>

    <noscript>JavaScriptを有効にして開いてください。</noscript>
  </body>
</html>
