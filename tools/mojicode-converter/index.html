<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字コード変換</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="tb-header mc-header">
      <div class="tb-header-start">
        <template id="toolbox-home"></template>
        <span class="tb-header-brand"
          ><img
            class="tb-header-icon"
            src="/src/icon.png"
            alt=""
          />文字コード変換</span
        ><button
          type="button"
          class="tb-button tb-icon-button tb-theme-toggle"
        ></button>
      </div>
    </header>

    <main class="mc-main">
      <section class="mc-panel mc-fields" aria-labelledby="mc-fields-title">
        <div class="mc-panel-head">
          <h2 id="mc-fields-title">文字と文字コード</h2>
          <span class="mc-mode mc-mode-edit">入力・編集</span>
        </div>
        <div class="mc-field mc-field-text">
          <label for="mc-text">文字</label>
          <textarea
            id="mc-text"
            class="tb-input"
            rows="2"
            placeholder="例：あ"
            spellcheck="false"
            autocomplete="off"
          ></textarea>
        </div>
        <div class="mc-codes">
          <div class="mc-field">
            <label for="mc-codepoint">Unicode の番号</label>
            <input
              id="mc-codepoint"
              class="tb-input mc-code"
              data-field="codepoint"
              placeholder="例：U+3042"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="mc-codepoint-status"
            />
            <p class="mc-status" id="mc-codepoint-status"></p>
          </div>
          <div class="mc-field">
            <label for="mc-utf8">UTF-8<span>バイト</span></label>
            <input
              id="mc-utf8"
              class="tb-input mc-code"
              data-field="utf8"
              placeholder="例：E3 81 82"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="mc-utf8-status"
            />
            <p class="mc-status" id="mc-utf8-status"></p>
          </div>
          <div class="mc-field">
            <label for="mc-utf16">UTF-16<span>符号単位</span></label>
            <input
              id="mc-utf16"
              class="tb-input mc-code"
              data-field="utf16"
              placeholder="例：3042"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="mc-utf16-status"
            />
            <p class="mc-status" id="mc-utf16-status"></p>
          </div>
          <div class="mc-field">
            <label for="mc-sjis">Shift_JIS<span>Windows（CP932）</span></label>
            <input
              id="mc-sjis"
              class="tb-input mc-code"
              data-field="sjis"
              placeholder="例：82 A0"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="mc-sjis-status"
            />
            <p class="mc-status" id="mc-sjis-status"></p>
          </div>
        </div>
      </section>

      <div class="mc-derived" id="mc-derived">
        <div class="mc-columns">
          <section class="mc-panel" aria-labelledby="mc-preview-title">
            <div class="mc-panel-head">
              <h2 id="mc-preview-title">大きく表示</h2>
            </div>
            <div class="mc-font">
              <label for="mc-font">フォント</label>
              <input
                id="mc-font"
                class="tb-input"
                list="mc-font-list"
                placeholder="標準（フォント名を入力）"
                spellcheck="false"
                autocomplete="off"
                aria-describedby="mc-font-status"
              />
              <datalist id="mc-font-list"></datalist>
              <button type="button" class="tb-button" id="mc-font-load" hidden>
                PCのフォントを一覧にする
              </button>
            </div>
            <p class="mc-status" id="mc-font-status"></p>
            <div class="mc-preview" id="mc-preview" lang="ja"></div>
          </section>

          <section class="mc-panel" aria-labelledby="mc-notation-title">
            <div class="mc-panel-head">
              <h2 id="mc-notation-title">表記の形</h2>
              <span class="mc-mode">表示のみ</span>
            </div>
            <div class="mc-notations" id="mc-notations"></div>
          </section>
        </div>

        <section class="mc-panel" aria-labelledby="mc-list-title">
          <div class="mc-panel-head">
            <h2 id="mc-list-title">1文字ずつの一覧</h2>
            <span class="mc-count" id="mc-count"></span>
          </div>
          <div class="mc-table-wrap">
            <table class="mc-table">
              <thead>
                <tr>
                  <th scope="col">文字</th>
                  <th scope="col">Unicode</th>
                  <th scope="col">UTF-8</th>
                  <th scope="col">UTF-16</th>
                  <th scope="col">Shift_JIS</th>
                  <th scope="col">素性</th>
                </tr>
              </thead>
              <tbody id="mc-rows"></tbody>
            </table>
          </div>
          <p class="mc-empty" id="mc-empty">
            文字を入れると、ここに1文字ずつ並びます。
          </p>
        </section>
      </div>

      <p class="mc-note">
        入力した文字はこのPC内で計算し、外部へ送信しません。
      </p>
    </main>
    <noscript>JavaScriptを有効にして開いてください。</noscript>
  </body>
</html>
