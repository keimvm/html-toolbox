name: Tool

on:
  workflow_call:
    inputs:
      tool:
        description: tools.json に登録したフォルダ名
        required: true
        type: string
      os:
        type: string
        default: ubuntu-latest
      upload:
        description: リリースのために収集した HTML を保存する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/${{ inputs.tool }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/${{ inputs.tool }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: tools/${{ inputs.tool }}/.node-version
          cache: pnpm
          cache-dependency-path: tools/${{ inputs.tool }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 検査とビルド
        run: pnpm check
      # 収集スクリプトはリポジトリ直下の Node.js で実行する。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 単一 HTML の構成を確かめて集める
        working-directory: .
        env:
          TOOL: ${{ inputs.tool }}
        shell: bash
        run: node scripts/toolbox.mjs collect "$TOOL"
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: tool-${{ inputs.tool }}
          path: build/${{ inputs.tool }}.html
          if-no-files-found: error
          retention-days: 1
