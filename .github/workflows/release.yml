name: Release

# GitHub の画面または gh release create でリリースを公開すると、3 OS で全体を検証してから版を付けてビルドし、
# toolbox-<版>.zip をそのリリースに添付する。版番号はリリースのタグから取る。検証かビルドが失敗したら添付しない。
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 版番号が日付形式か確認
        run: node scripts/toolbox.mjs check-version "$VERSION"
      - name: 検証・版を付けたビルド・zip の作成
        run: node scripts/toolbox.mjs release "$VERSION"
      - name: zip をリリースに添付
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$VERSION" "out/toolbox-$VERSION.zip" --clobber
