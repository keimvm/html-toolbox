name: Check

# 整形・lint・テスト・ビルド・配布物のテストを Linux・macOS・Windows で実行する。
# push・PR では動かさず、リリースの公開時（release.yml から呼ぶ）と手動の「Run workflow」だけで実行する。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存取得・整形・lint・テスト・ビルド・配布物のテスト
        run: node scripts/toolbox.mjs check

  # OS の組み合わせが変わっても変わらない、検証全体の結果。
  result:
    name: Check result
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 検証結果を確認
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
